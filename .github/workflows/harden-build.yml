name: harden-build

# Builds the hardened hbbs/hbbr for x86_64.
#
# The build runs inside rust:alpine so the produced binary is linked against the
# same musl and ABI as the Alpine/scratch runtime image; building on the Ubuntu
# runner instead yields a dynamic-musl binary that segfaults under Alpine.
# Rust on Alpine targets x86_64-unknown-linux-musl by default and links static.

on:
  workflow_dispatch:

jobs:
  build-musl:
    runs-on: ubuntu-22.04
    container:
      image: rust:1-alpine
    steps:
      - name: Install build prerequisites
        run: |
          # GNU tar: the BusyBox one in this image cannot pack the cache archive
          # (it lacks --posix), which made rust-cache save nothing.
          apk add --no-cache musl-dev pkgconf git build-base openssl-dev tar

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Keep the cache stable across runs: only the crate sources matter.
          key: musl-amd64
          cache-on-failure: true

      - name: Build
        run: cargo build --release

      - name: Report binaries
        run: |
          ls -la target/release/hbbs target/release/hbbr
          file target/release/hbbs
          file target/release/hbbr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-musl-amd64
          if-no-files-found: error
          path: |
            target/release/hbbs
            target/release/hbbr
